<!DOCTYPE html>
<html>
<head>
    <title>Train — RL Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <h1>RL Training Dashboard</h1>
        <a href="/">Overview</a>
        <a href="/train">Train</a>
        <a href="/play">Play</a>
        <a href="/gridsearch">Grid Search</a>
        <a href="/results">Results</a>
    </nav>
    <main>
        <h2>Start Training</h2>

        <div class="form-group">
            <label>Config Preset:</label>
            <select id="configPreset">
                {% for c in configs %}
                <option value="{{ c.name }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="configForm"></div>

        <div class="button-group">
            <button id="startBtn" onclick="startTraining()">Start Training</button>
            <button id="stopBtn" onclick="stopTraining()" disabled>Stop Training</button>
        </div>

        <div id="status"></div>
        <div id="error" style="color: #b00020; margin: 1rem 0;"></div>

        <h3>Training Log</h3>
        <pre id="log"></pre>
    </main>

    <script>
        const presets = {
            {% for c in configs %}
            "{{ c.name }}": {{ c.config | tojson }},
            {% endfor %}
        };

        const presetSelect = document.getElementById('configPreset');

        // Field definitions: key -> {label, type, min, max, step}
        const PPO_FIELDS = [
            ['updates', 'Updates', 1, 100000, 1],
            ['rollout_size', 'Rollout Size', 8, 8192, 8],
            ['seed', 'Seed', 0, 999999, 1],
            ['checkpoint_every', 'Checkpoint Every (updates)', 1, 100000, 1],
            ['learning_rate', 'Learning Rate', 1e-6, 1, 1e-6],
            ['gamma', 'Gamma', 0, 1, 0.01],
            ['gae_lambda', 'GAE Lambda', 0, 1, 0.01],
            ['epsilon', 'Epsilon (clip range)', 0, 1, 0.01],
            ['epochs', 'Epochs', 1, 100, 1],
            ['minibatch_size', 'Minibatch Size', 1, 4096, 1],
            ['hidden_dim', 'Hidden Dim', 16, 8192, 16],
            ['frame_skip', 'Frame Skip', 1, 16, 1],
            ['num_stack', 'Frame Stack', 1, 16, 1],
            ['frame_size', 'Frame Size', 32, 256, 4],
        ];

        const DQN_FIELDS = [
            ['total_steps', 'Total Steps', 1, 100000000, 1],
            ['buffer_size', 'Replay Buffer Size', 100, 1000000, 100],
            ['batch_size', 'Batch Size', 1, 4096, 1],
            ['target_update_freq', 'Target Update Freq (steps)', 1, 100000, 1],
            ['epsilon_start', 'Epsilon Start', 0, 1, 0.01],
            ['epsilon_end', 'Epsilon End', 0, 1, 0.01],
            ['epsilon_decay_steps', 'Epsilon Decay Steps', 1, 10000000, 1],
            ['train_start', 'Train Start (burn-in steps)', 0, 10000000, 1],
            ['log_every', 'Log Every (steps)', 1, 100000, 1],
            ['eval_every', 'Eval Every (steps, 0 = off)', 0, 1000000, 1],
            ['eval_episodes', 'Eval Episodes', 1, 100, 1],
            ['seed', 'Seed', 0, 999999, 1],
            ['checkpoint_every', 'Checkpoint Every (steps)', 1, 1000000, 1],
            ['learning_rate', 'Learning Rate', 1e-6, 1, 1e-6],
            ['gamma', 'Gamma', 0, 1, 0.01],
            ['hidden_dim', 'Hidden Dim', 16, 8192, 16],
            ['frame_skip', 'Frame Skip', 1, 16, 1],
            ['num_stack', 'Frame Stack', 1, 16, 1],
            ['frame_size', 'Frame Size', 32, 256, 4],
        ];

        const FIELDS_BY_ALGO = { ppo: PPO_FIELDS, dqn: DQN_FIELDS };

        function currentAlgo() {
            const cfg = presets[presetSelect.value] || {};
            return cfg.algorithm === 'dqn' ? 'dqn' : 'ppo';
        }

        function currentFields() {
            return FIELDS_BY_ALGO[currentAlgo()];
        }

        const form = document.getElementById('configForm');

        function renderForm() {
            const fields = currentFields();
            const firstCfg = presets[presetSelect.value] || {};
            form.innerHTML = '<div class="form-grid">' + fields.map(([key, label, min, max, step]) =>
                `<div class="form-group">
                    <label>${label}:</label>
                    <input type="number" id="f_${key}" min="${min}" max="${max}" step="${step}">
                    <span class="hint">range ${min}–${max}, default ${firstCfg[key] !== undefined ? firstCfg[key] : '-'}</span>
                </div>`).join('') +
                `<div class="form-group">
                    <label>Conv Channels (comma separated):</label>
                    <input type="text" id="f_conv_channels">
                    <span class="hint">e.g. 64,128,128</span>
                </div>
                <div class="form-group">
                    <label>Device:</label>
                    <select id="f_device">
                        <option value="auto">auto</option>
                        <option value="mps">mps</option>
                        <option value="cuda">cuda</option>
                        <option value="cpu">cpu</option>
                    </select>
                    <span class="hint">default: auto</span>
                </div>
                <div class="form-group">
                    <label>Checkpoint Dir:</label>
                    <select id="f_checkpoint_dir"></select>
                    <span class="hint">sub-directory name inside each run's folder</span>
                </div></div>`;
        }

        renderForm();

        fetch('/api/checkpoint_dirs').then(r => r.json()).then(dirs => {
            const sel = document.getElementById('f_checkpoint_dir');
            sel.innerHTML = dirs.map(d => `<option value="${d}">${d}</option>`).join('') || '<option value="checkpoints">checkpoints</option>';
            const cfg = presets[presetSelect.value] || {};
            if (cfg.checkpoint_dir) {
                const name = cfg.checkpoint_dir.split('/').filter(Boolean).pop();
                if ([...sel.options].some(o => o.value === name)) sel.value = name;
            }
        });

        function loadPreset() {
            const cfg = presets[presetSelect.value] || {};
            renderForm();
            for (const [key] of currentFields()) {
                if (cfg[key] !== undefined) document.getElementById('f_' + key).value = cfg[key];
            }
            if (cfg.conv_channels) document.getElementById('f_conv_channels').value = cfg.conv_channels.join(',');
            if (cfg.device) document.getElementById('f_device').value = cfg.device;
            if (cfg.checkpoint_dir) {
                const name = cfg.checkpoint_dir.split('/').filter(Boolean).pop();
                const sel = document.getElementById('f_checkpoint_dir');
                if ([...sel.options].some(o => o.value === name)) sel.value = name;
            }
        }

        presetSelect.addEventListener('change', loadPreset);
        loadPreset();

        function buildConfig() {
            const errors = [];
            const config = { algorithm: currentAlgo() };
            const integerKeys = new Set(['total_steps', 'buffer_size', 'batch_size', 'target_update_freq',
                'epsilon_decay_steps', 'train_start', 'log_every', 'eval_every', 'eval_episodes', 'seed',
                'checkpoint_every', 'epochs', 'minibatch_size', 'rollout_size', 'updates', 'hidden_dim',
                'frame_skip', 'num_stack', 'frame_size']);
            for (const [key, label, min, max, step] of currentFields()) {
                const el = document.getElementById('f_' + key);
                const v = parseFloat(el.value);
                if (el.value === '' || isNaN(v)) {
                    errors.push(`${label} is required`);
                } else if (v < min || v > max) {
                    errors.push(`${label} must be between ${min} and ${max}`);
                } else {
                    config[key] = integerKeys.has(key) ? parseInt(el.value) : v;
                }
            }
            const channels = document.getElementById('f_conv_channels').value.split(',').map(s => parseInt(s.trim()));
            if (channels.some(isNaN) || channels.length === 0) {
                errors.push('Conv Channels must be comma-separated integers');
            } else {
                config.conv_channels = channels;
            }
            config.device = document.getElementById('f_device').value;
            config.checkpoint_dir = document.getElementById('f_checkpoint_dir').value || 'checkpoints';
            return { config, errors };
        }

        async function startTraining() {
            const { config, errors } = buildConfig();
            const errorDiv = document.getElementById('error');
            if (errors.length) {
                errorDiv.textContent = 'Invalid input: ' + errors.join('; ');
                return;
            }
            errorDiv.textContent = '';
            const res = await fetch('/api/train', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config),
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('status').textContent = `Training started (PID ${data.pid})`;
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
            } else {
                errorDiv.textContent = 'Error: ' + (data.detail || 'failed to start');
            }
        }

        async function stopTraining() {
            await fetch('/api/train/stop', { method: 'POST' });
            document.getElementById('status').textContent = 'Training stopped';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        async function checkStatus() {
            const res = await fetch('/api/train/status');
            const data = await res.json();
            if (!data.running) {
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }

        setInterval(checkStatus, 2000);
    </script>
</body>
</html>
