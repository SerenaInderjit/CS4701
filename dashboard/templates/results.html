<!DOCTYPE html>
<html>
<head>
    <title>Results — RL Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <h1>RL Training Dashboard</h1>
        <a href="/">Overview</a>
        <a href="/train">Train</a>
        <a href="/play">Play</a>
        <a href="/gridsearch">Grid Search</a>
        <a href="/results">Results</a>
    </nav>
    <main>
        <h2>Baseline Results</h2>

        <div class="button-group">
            <button id="refreshBtn">Regenerate Statistics &amp; Plots</button>
            <button id="fullBtn">Run Full Analysis (Eval + Analyze + Plot)</button>
        </div>
        <div id="status">Loading...</div>

        <h3>Compare Policies</h3>
        <div id="compareControls">
            <div id="labelList"></div>
            <div class="form-group">
                <label>Metric:</label>
                <select id="compareMetric">
                    <option value="max_x_pos">max_x_pos</option>
                    <option value="total_reward">total_reward</option>
                    <option value="length">length</option>
                </select>
            </div>
            <div class="button-group">
                <button id="compareBtn">Compare Selected</button>
            </div>
            <div id="compareResult"></div>
        </div>

        <h3>Statistics</h3>
        <table id="statsTable">
            <thead><tr id="statsHead"></tr></thead>
            <tbody id="statsBody"></tbody>
        </table>

        <h3>Plots</h3>
        <div class="plots" id="plotsGrid"></div>
    </main>

    <script>
        async function loadStatistics() {
            const res = await fetch('/api/results/statistics');
            if (!res.ok) {
                document.getElementById('statsBody').innerHTML =
                    '<tr><td>No statistics found. Run eval, then regenerate.</td></tr>';
                return;
            }
            const stats = await res.json();
            if (!stats.length) return;
            const columns = Object.keys(stats[0]);
            document.getElementById('statsHead').innerHTML =
                columns.map(c => `<th>${c}</th>`).join('');
            document.getElementById('statsBody').innerHTML = stats.map(row =>
                '<tr>' + columns.map(c => {
                    const v = row[c];
                    return `<td>${typeof v === 'number' ? v.toFixed(2) : v}</td>`;
                }).join('') + '</tr>'
            ).join('');
        }

        async function loadPlots() {
            const res = await fetch('/api/results/plots');
            const plots = await res.json();
            document.getElementById('plotsGrid').innerHTML = plots.map(p =>
                `<img src="/api/results/plot/${p}?t=${Date.now()}" alt="${p}">`
            ).join('') || '<p>No plots yet.</p>';
        }

        async function refresh() {
            const status = document.getElementById('status');
            status.textContent = 'Regenerating...';
            const res = await fetch('/api/results/refresh', { method: 'POST' });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                status.textContent = 'Done.';
                await loadStatistics();
                await loadPlots();
            } else {
                status.textContent = 'Error: ' + (data.detail || 'refresh failed');
            }
        }

        async function loadLabels() {
            const res = await fetch('/api/results/available');
            const labels = await res.json();
            document.getElementById('labelList').innerHTML = labels.map(l =>
                `<label style="margin-right:1rem"><input type="checkbox" value="${l}"> ${l}</label>`
            ).join('');
        }

        async function compare() {
            const checked = Array.from(document.querySelectorAll('#labelList input:checked'))
                .map(i => i.value);
            const metric = document.getElementById('compareMetric').value;
            if (checked.length < 2) {
                document.getElementById('compareResult').textContent = 'Select at least 2.';
                return;
            }
            const res = await fetch('/api/results/compare', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({labels: checked, metric}),
            });
            if (res.ok) {
                const blob = await res.blob();
                document.getElementById('compareResult').innerHTML =
                    `<img src="${URL.createObjectURL(blob)}" style="max-width:100%">`;
            } else {
                const data = await res.json();
                document.getElementById('compareResult').textContent = 'Error: ' + (data.detail || 'failed');
            }
        }

        async function fullAnalysis() {
            const status = document.getElementById('status');
            status.textContent = 'Running full analysis (this may take a while)...';
            const res = await fetch('/api/results/full_analysis', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({episodes: 10, timeout: 2000}),
            });
            const data = await res.json().catch(() => ({}));
            status.textContent = res.ok ? 'Full analysis done.' : 'Error: ' + (data.detail || 'failed');
            await loadStatistics();
            await loadPlots();
            await loadLabels();
        }

        document.getElementById('refreshBtn').addEventListener('click', refresh);
        document.getElementById('fullBtn').addEventListener('click', fullAnalysis);
        document.getElementById('compareBtn').addEventListener('click', compare);
        (async () => {
            await loadStatistics();
            await loadPlots();
            await loadLabels();
            document.getElementById('status').textContent = '';
        })();
    </script>
</body>
</html>
